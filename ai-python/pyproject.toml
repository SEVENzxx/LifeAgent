[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lifeagent-ai"
version = "0.1.0"
description = "LifeAgent 无状态 AI Sidecar"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.116.1",
    "httpx==0.28.1",
    "pydantic==2.11.7",
    "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
