# Docker Compose 重建后端容器时 IP 可能变化，动态解析可避免 Nginx 长期持有失效地址。
resolver 127.0.0.11 valid=10s ipv6=off;

upstream lifeagent_java {
    zone lifeagent_java 64k;
    server lifeagent-java:8080 resolve;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location /api/ {
        proxy_pass http://lifeagent_java;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /actuator/ {
        proxy_pass http://lifeagent_java;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # 本地脚手架通过统一入口提供 OpenAPI 文档，生产环境可在网关层按权限关闭。
    location /v3/api-docs {
        proxy_pass http://lifeagent_java;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /swagger-ui/ {
        proxy_pass http://lifeagent_java;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        return 404;
    }
}
