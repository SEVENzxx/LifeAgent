spring:
  application:
    name: lifeagent-java
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifeagent}
    username: ${DATABASE_USERNAME:lifeagent}
    password: ${DATABASE_PASSWORD:lifeagent}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

lifeagent:
  mock-channel:
    enabled: ${MOCK_CHANNEL_ENABLED:false}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
