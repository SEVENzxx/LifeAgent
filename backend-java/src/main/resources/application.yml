spring:
  profiles:
    active: local
  application:
    name: lifeagent-java
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lifeagent}
    username: ${DATABASE_USERNAME:lifeagent}
    password: ${DATABASE_PASSWORD:lifeagent}
    hikari:
      connection-timeout: 3000
      validation-timeout: 1000
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2000
      connect-timeout: 2000
  flyway:
    enabled: true
    locations: classpath:db/migration
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    banner: false

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true
      group:
        liveness:
          include: livenessState
        readiness:
          include: readinessState,db

lifeagent:
  wecom:
    enabled: ${WECOM_CHANNEL_ENABLED:false}
    corp-id: ${WECOM_CORP_ID:}
    agent-id: ${WECOM_AGENT_ID:}
    callback-token: ${WECOM_CALLBACK_TOKEN:}
    encoding-aes-key: ${WECOM_ENCODING_AES_KEY:}
    corp-secret: ${WECOM_CORP_SECRET:}
    api-base-url: ${WECOM_API_BASE_URL:https://qyapi.weixin.qq.com}
  ai:
    base-url: ${AI_BASE_URL:http://localhost:8000}
    internal-token: ${INTERNAL_SERVICE_TOKEN:lifeagent-local-token}
    connect-timeout-ms: ${AI_CONNECT_TIMEOUT_MS:2000}
    read-timeout-ms: ${AI_READ_TIMEOUT_MS:15000}
    recent-max-messages: ${CONTEXT_RECENT_MAX_MESSAGES:12}
    recent-max-chars: ${CONTEXT_RECENT_MAX_CHARS:6000}
    summary-trigger-messages: ${CONTEXT_SUMMARY_TRIGGER_MESSAGES:20}
    summary-trigger-chars: ${CONTEXT_SUMMARY_TRIGGER_CHARS:8000}
    summary-max-chars: ${CONTEXT_SUMMARY_MAX_CHARS:1500}
    context-cache-ttl-seconds: ${CONTEXT_CACHE_TTL:86400}
    reminder-scan-interval-ms: ${REMINDER_SCAN_INTERVAL_MS:5000}
    reminder-job-batch-size: ${REMINDER_JOB_BATCH_SIZE:20}
    reminder-job-lease-seconds: ${REMINDER_JOB_LEASE_SECONDS:60}
    reminder-max-retries: ${REMINDER_MAX_RETRIES:3}
    reminder-retry-delays-minutes: ${REMINDER_RETRY_DELAYS:1m,5m,15m}
    reminder-late-grace-minutes: ${REMINDER_LATE_GRACE:30}
    reminder-draft-ttl-minutes: ${REMINDER_DRAFT_TTL:30}
    reminder-write-min-confidence: ${REMINDER_WRITE_MIN_CONFIDENCE:0.8}
  behavior:
    max-future-skew-seconds: ${BEHAVIOR_MAX_FUTURE_SKEW:300}
    max-past-age-seconds: ${BEHAVIOR_MAX_PAST_AGE:2592000}
    max-interval-seconds: ${BEHAVIOR_MAX_INTERVAL:14400}
    query-max-range-seconds: ${BEHAVIOR_QUERY_MAX_RANGE:2678400}
    query-max-intervals: ${BEHAVIOR_QUERY_MAX_INTERVALS:500}

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
