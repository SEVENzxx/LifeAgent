name: lifeagent

x-java-environment: &java-environment
  DATABASE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-lifeagent}
  DATABASE_USERNAME: ${POSTGRES_USER:-lifeagent}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-lifeagent}
  REDIS_HOST: redis
  REDIS_PORT: 6379
  REDIS_DATABASE: 0
  AI_BASE_URL: http://lifeagent-ai-python:8000
  INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lifeagent-local-token}

services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-lifeagent}
      POSTGRES_USER: ${POSTGRES_USER:-lifeagent}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lifeagent}
      TZ: Asia/Shanghai
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped
    networks:
      - lifeagent-internal

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    networks:
      - lifeagent-internal

  lifeagent-ai-python:
    build:
      context: ./ai-python
    image: lifeagent-ai-python:local
    environment:
      LLM_PROVIDER: ${LLM_PROVIDER:-openai-compat}
      OPENAI_COMPAT_API_KEY: ${OPENAI_COMPAT_API_KEY:-}
      OPENAI_COMPAT_BASE_URL: ${OPENAI_COMPAT_BASE_URL:-https://dashscope.aliyuncs.com/compatible-mode/v1}
      OPENAI_COMPAT_MODEL: ${OPENAI_COMPAT_MODEL:-qwen-turbo}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-lifeagent-local-token}
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/internal/v1/health/ready', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - lifeagent-internal

  lifeagent-java:
    build:
      context: ./backend-java
    image: lifeagent-java:local
    environment:
      <<: *java-environment
      SERVER_PORT: 8080
    expose:
      - "8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
      lifeagent-ai-python:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8080/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped
    networks:
      - lifeagent-internal

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${LIFEAGENT_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      lifeagent-java:
        condition: service_healthy
    healthcheck:
      # 健康检查必须穿透到 Java 上游，避免代理自身存活但业务入口已返回 502。
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/actuator/health/readiness"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped
    networks:
      - lifeagent-internal

volumes:
  postgres-data:
  redis-data:

networks:
  lifeagent-internal:
    driver: bridge
